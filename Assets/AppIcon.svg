<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- DiskLens app icon: a graphite lens over a three-tile treemap in muted tones,
       on a pale aluminium plate, using the macOS icon grid (824 pt rounded square). -->
  <defs>
    <path id="shape" d="M300 100 H724 C850 100 924 174 924 300 V724 C924 850 850 924 724 924 H300 C174 924 100 850 100 724 V300 C100 174 174 100 300 100Z"/>
    <clipPath id="clipShape"><use xlink:href="#shape"/></clipPath>
    <clipPath id="clipLens"><circle cx="462" cy="462" r="196"/></clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset="1" stop-color="#e2e5ea"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a606c"/>
      <stop offset="1" stop-color="#23262d"/>
    </linearGradient>
    <linearGradient id="handle" gradientUnits="userSpaceOnUse" x1="0" y1="-32" x2="0" y2="32">
      <stop offset="0" stop-color="#5a606c"/>
      <stop offset="1" stop-color="#1f2228"/>
    </linearGradient>

    <linearGradient id="t1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa9c9"/><stop offset="1" stop-color="#6f8db3"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3c9b8"/><stop offset="1" stop-color="#93ae9b"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3d2b4"/><stop offset="1" stop-color="#cdb791"/></linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="170%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#iconShadow)"><use xlink:href="#shape" fill="url(#bg)"/></g>
  <g clip-path="url(#clipShape)">
    <g filter="url(#soft)">
      <g transform="translate(462 462) rotate(45)">
        <rect x="222" y="-32" width="180" height="64" rx="32" fill="url(#handle)"/>
      </g>
      <circle cx="462" cy="462" r="224" fill="url(#ring)"/>
    </g>

    <!-- Three folders seen through the lens -->
    <g clip-path="url(#clipLens)">
      <rect x="240" y="240" width="444" height="444" fill="#f4f5f7"/>
      <rect x="260" y="260" width="192" height="404" rx="14" fill="url(#t1)"/>
      <rect x="464" y="260" width="200" height="212" rx="14" fill="url(#t2)"/>
      <rect x="464" y="484" width="200" height="180" rx="14" fill="url(#t3)"/>
      <circle cx="462" cy="462" r="196" fill="url(#sheen)"/>
    </g>
    <circle cx="462" cy="462" r="196" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="3"/>
    <circle cx="462" cy="462" r="222" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="2"/>
  </g>
  <use xlink:href="#shape" fill="none" stroke="#000" stroke-opacity="0.06" stroke-width="2"/>
</svg>
